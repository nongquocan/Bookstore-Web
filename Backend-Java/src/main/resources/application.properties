# ============================================
# 🏪 BookStore Backend Configuration
# ============================================

# Loads application-local.properties (gitignored) on top of this file,
# where real secrets (DB password, JWT secret, mail password, API keys) live.
# Copy application-local.properties.example to application-local.properties and fill in real values.
spring.config.import=optional:application-local.properties

# ============================================
# Database Configuration
# ============================================
spring.datasource.url=jdbc:mysql://localhost:3306/bookstore_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:changeme}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================
# JPA / Hibernate Configuration
# ============================================
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# ============================================
# Server Configuration
# ============================================
server.port=8080
server.servlet.context-path=/
server.compression.enabled=true
server.compression.min-response-size=1024

# ============================================
# Logging Configuration
# ============================================
logging.level.root=INFO
logging.level.com.bookstore=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n

# ============================================
# Application Configuration
# ============================================
spring.application.name=BookStore Backend
spring.devtools.restart.enabled=true

# ============================================
# Jackson Configuration (JSON Serialization)
# ============================================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# ============================================
# JWT Configuration
# ============================================
app.jwtSecret=${JWT_SECRET:changeme-please-override-in-application-local-properties}
app.jwtExpirationMs=86400000


#  App
app.frontendUrl=http://localhost:63342/Web-site/Frontend/pages


# ============================================
# Mail Configuration (Gmail SMTP)
# ============================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=annong1409@gmail.com
spring.mail.password=${MAIL_PASSWORD:changeme}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# OTP Settings
app.otp.expiry-minutes=5
app.otp.from-email=${spring.mail.username}
app.store-name=BookStore

# ============================================
# SePay Webhook Configuration
# ============================================
# Thay chuỗi này bằng API Token lấy từ trang Tích hợp Webhook của SePay
sepay.webhook-token=${SEPAY_WEBHOOK_TOKEN:changeme}

# ============================================
# Google Gemini AI Configuration
# ============================================
# Thay bằng API Key thật từ
gemini.api.key=${GEMINI_API_KEY:changeme}

