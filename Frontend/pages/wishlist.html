<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh Sách Yêu Thích - BookStore</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
    <style>
        .page-wrapper {
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px 20px;
        }
        .page-title {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        /* Custom cho nút xóa khỏi wishlist */
        .btn-remove-wishlist {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(255, 255, 255, 0.9);
            color: var(--danger-color);
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 2;
            transition: var(--transition-base);
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .btn-remove-wishlist:hover {
            background: var(--danger-color);
            color: white;
            transform: scale(1.1);
        }
    </style>
</head>
<body>

<header class="header">
    <div class="container">
        <div class="navbar">
            <a href="../index.html" class="logo">
                <i class="fas fa-book-open"></i>
                <span>BookStore</span>
            </a>

            <div class="search-container" style="position:relative;">
                <input type="search" id="mainSearchInput" class="search-input" placeholder="Tìm sách, tác giả, thể loại...">
                <button id="mainSearchBtn" style="position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:#666;">
                    <i class="fas fa-search"></i>
                </button>
            </div>

            <div class="icon-bar">
                <div id="authArea" style="position:relative;">
                    <a id="btnLogin" href="login.html" class="icon-item" title="Đăng nhập">
                        <i class="fas fa-user"></i>
                        <span style="font-size:13px; margin-left:5px;">Đăng nhập</span>
                    </a>

                    <div id="userMenu" style="display:none;position:relative;">
                        <button id="userMenuBtn" onclick="toggleUserDropdown()" style="background:none;border:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:6px;">
                            <div id="userAvatar" style="width:32px;height:32px;border-radius:50%;background:var(--primary-color);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;">U</div>
                            <span id="userName" style="font-size:13px;font-weight:600;max-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;"></span>
                            <i class="fas fa-chevron-down" style="font-size:10px;color:#666;"></i>
                        </button>

                        <div id="userDropdown" style="display:none;position:absolute;right:0;top:calc(100% + 6px);background:#fff;border:1px solid #e0e0e0;border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.12);min-width:190px;z-index:999;overflow:hidden;">
                            <div style="padding:12px 16px;border-bottom:1px solid #f0f0f0;background:#fafafa;">
                                <div style="font-size:12px;color:#888;">Xin chào,</div>
                                <div id="dropdownName" style="font-weight:700;font-size:14px;color:var(--text-dark);"></div>
                            </div>
                            <a href="account.html" style="display:flex;align-items:center;gap:10px;padding:11px 16px;font-size:13px;color:#333;text-decoration:none;">
                                <i class="fas fa-user-circle" style="width:16px;"></i> Tài khoản
                            </a>
                            <a href="orders.html" style="display:flex;align-items:center;gap:10px;padding:11px 16px;font-size:13px;color:#333;text-decoration:none;">
                                <i class="fas fa-box" style="width:16px;"></i> Đơn hàng
                            </a>
                            <a href="wishlist.html" style="display:flex;align-items:center;gap:10px;padding:11px 16px;font-size:13px;color:var(--primary-color);font-weight:600;background:#fff5f5;text-decoration:none;">
                                <i class="fas fa-heart" style="width:16px;"></i> Yêu thích
                            </a>
                            <!-- Admin link — chỉ hiện nếu role ADMIN -->
                            <a id="adminMenuLink" href="../admin/dashboard.html"
                              style="display:none;align-items:center;gap:10px;padding:11px 16px;font-size:13px;color:#d32f2f;text-decoration:none;font-weight:600;border-top:1px solid #f0f0f0;"
                              onmouseover="this.style.background='#fff5f5'" onmouseout="this.style.background='none'">
                              <i class="fas fa-shield-alt" style="width:16px;color:#d32f2f;"></i> Trang Admin
                            </a>
                            <div style="border-top:1px solid #f0f0f0;">
                                <button onclick="handleLogout()" style="width:100%;display:flex;align-items:center;gap:10px;padding:11px 16px;font-size:13px;color:var(--danger-color);background:none;border:none;cursor:pointer;text-align:left;">
                                    <i class="fas fa-sign-out-alt" style="width:16px;"></i> Đăng xuất
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <a href="cart.html" class="icon-item" title="Giỏ hàng">
                    <i class="fas fa-shopping-cart"></i>
                    <span class="cart-badge" id="cartCount" style="display:none;">0</span>
                </a>
            </div>
        </div>
    </div>
</header>

<main>
    <div class="page-wrapper">
        <h1 class="page-title">
            <i class="fas fa-heart" style="color:var(--primary-color);"></i>
            Sách Yêu Thích
        </h1>

        <div id="wishlistContainer" class="products-grid">
        </div>

        <div id="emptyMessage" style="display:none; text-align:center; padding:60px 20px;">
            <div style="font-size: 64px; margin-bottom: 20px; color: #ddd;">❤️</div>
            <p style="font-size: 18px; color: var(--text-gray); margin-bottom: 25px;">Danh sách yêu thích của bạn đang trống</p>
            <a href="../index.html" class="btn btn-primary">Khám Phá Sách Ngay</a>
        </div>
    </div>
</main>

<script src="../assets/js/config.js"></script>
<script src="../assets/js/api.js"></script>
<script>
    /* ── AUTH STATE ── */
    (function initAuth() {
        const token = localStorage.getItem('bookstore_token');
        const userRaw = localStorage.getItem('bookstore_user');
        const user = userRaw ? JSON.parse(userRaw) : null;

        if (token && user) {
            document.getElementById('btnLogin').style.display = 'none';
            document.getElementById('userMenu').style.display = 'block';
            const fullName = [user.firstName, user.lastName].filter(Boolean).join(' ') || user.email || 'Người dùng';
            document.getElementById('userName').textContent = fullName;
            document.getElementById('userAvatar').textContent = fullName.charAt(0).toUpperCase();
            document.getElementById('dropdownName').textContent = fullName;
            updateCartBadge();

            // Hiện link Admin nếu user có role ADMIN
            const roles = user.roles || user.authorities || [];
            const isAdmin = roles.some(r => {
              const v = typeof r === 'string' ? r : (r.name || r.authority || r.role || '');
              return v === 'ROLE_ADMIN' || v === 'ADMIN';
            });
            const adminLink = document.getElementById('adminMenuLink');
            if (adminLink && isAdmin) adminLink.style.display = 'flex';
        }
    })();

    async function updateCartBadge() {
        try {
            const res = await api.getCart();
            const items = res.data || res || [];
            const count = items.reduce((sum, item) => sum + (item.quantity || 0), 0);
            const badge = document.getElementById('cartCount');
            if(count > 0) {
                badge.textContent = count;
                badge.style.display = 'flex';
            }
        } catch(e) {}
    }

    function toggleUserDropdown() {
        const dd = document.getElementById('userDropdown');
        dd.style.display = dd.style.display === 'none' ? 'block' : 'none';
    }

    function handleLogout() {
        localStorage.removeItem('bookstore_token');
        localStorage.removeItem('bookstore_user');
        window.location.href = 'login.html';
    }

    /* ── WISHLIST LOGIC ── */
    async function loadWishlist() {
        if (!api.isAuthenticated()) {
            document.getElementById('wishlistContainer').innerHTML = '<div class="alert alert-info">Vui lòng đăng nhập để xem danh sách yêu thích.</div>';
            return;
        }

        try {
            const response = await api.getWishlist();
            const wishlist = response.data || [];
            const container = document.getElementById('wishlistContainer');
            const emptyMessage = document.getElementById('emptyMessage');

            if (wishlist.length === 0) {
                container.style.display = 'none';
                emptyMessage.style.display = 'block';
                return;
            }

            container.style.display = 'grid';
            emptyMessage.style.display = 'none';

            container.innerHTML = wishlist.map(item => `
                <div class="product-card">
                    <div class="product-image-wrapper">
                        <button onclick="removeFromWishlist('${item.bookId}')" class="btn-remove-wishlist" title="Xóa khỏi yêu thích">
                            <i class="fas fa-times"></i>
                        </button>
                        <a href="product-detail.html?id=${item.bookId}">
                            <img src="${item.bookThumbnail || 'https://via.placeholder.com/250x350?text=No+Image'}"
                                 alt="${item.bookTitle}" class="product-image"
                                 onerror="this.src='https://via.placeholder.com/250x350?text=No+Image'">
                        </a>
                    </div>
                    <div class="product-info">
                        <h3 class="product-name"><a href="product-detail.html?id=${item.bookId}" style="text-decoration:none; color:inherit;">${item.bookTitle}</a></h3>
                        <p class="product-author">${item.bookAuthors || 'Đang cập nhật'}</p>
                        <div class="product-bottom-row">
                            <span class="card-price">${new Intl.NumberFormat('vi-VN').format(item.price)}đ</span>
                            <button class="btn-cart-icon" onclick="addToCartFromWishlist('${item.bookId}')" title="Thêm vào giỏ hàng">
                                <i class="fas fa-cart-plus"></i>
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        } catch (error) {
            console.error(error);
            document.getElementById('wishlistContainer').innerHTML = '<div class="alert alert-danger">Không thể tải danh sách yêu thích.</div>';
        }
    }

    async function removeFromWishlist(bookId) {
        if(!confirm('Bạn có muốn xóa sách này khỏi danh sách yêu thích?')) return;
        try {
            await api.removeFromWishlist(bookId);
            loadWishlist();
        } catch (error) {
            alert('Lỗi khi xóa sản phẩm.');
        }
    }

    async function addToCartFromWishlist(bookId) {
        try {
            await api.addToCart(bookId, 1);
            updateCartBadge();
            alert('Đã thêm vào giỏ hàng thành công!');
        } catch (error) {
            alert('Lỗi khi thêm vào giỏ hàng.');
        }
    }

    document.addEventListener('DOMContentLoaded', loadWishlist);
    document.addEventListener('click', (e) => {
        if (!document.getElementById('userMenu').contains(e.target)) {
            document.getElementById('userDropdown').style.display = 'none';
        }
    });
</script>

<script>
    (function initHeaderSearch() {
        var input = document.getElementById('mainSearchInput');
        var btn   = document.getElementById('mainSearchBtn');
        if (!input) return;
        function goSearch(q) {
            q = (q || '').trim();
            if (!q) return;
            window.location.href = 'products.html?search=' + encodeURIComponent(q);
        }
        input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') goSearch(this.value);
        });
        btn.addEventListener('click', function() { goSearch(input.value); });
    })();
</script>

  <!-- AI Book Chat Widget -->
  <script src="../assets/js/ai-chat.js"></script>

</body>

</html>
